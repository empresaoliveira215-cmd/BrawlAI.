                  val rw = maxOf(b.width(), b.height())
                  val rh = minOf(b.width(), b.height())
                  cw = 512
                  ch = maxOf(2, 512 * rh / maxOf(rw, 1))
                  val r = ImageReader.newInstance(cw, ch, PixelFormat.RGBA_8888, 2)
                  reader = r
                  r.setOnImageAvailableListener({ rd -> onImage(rd) }, hd)
                  vd = p.createVirtualDisplay(
