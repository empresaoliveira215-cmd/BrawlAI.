                  var img: Image? = null
                  try {
                      img = rd.acquireLatestImage()
                      if (img == null) return
                      val pl = img.planes[0]
                      val ps = pl.pixelStride
                      val rs = pl.rowStride
                      val padW = rs / maxOf(ps, 1)
                      var b = bmp
                      if (b == null || b.width != padW || b.height != ch) {
                          b = Bitmap.createBitmap(padW, ch, Bitmap.Config.ARGB_8888)
                          bmp = b
                      }
                      val buf = pl.buffer
                      buf.rewind()
                      b!!.copyPixelsFromBuffer(buf)
                      BotService.instance?.onFrame(b, cw, ch)
                  } catch (e: Throwable) {
                  } finally {
                      try { img?.close() } catch (e: Throwable) { }
                  }
              }

              private fun stopAll() {
                  if (stopping) return
                  stopping = true
                  running = false
                  try { vd?.release() } catch (e: Throwable) { }
                  vd = null
                  try { reader?.setOnImageAvailableListener(null, null); reader?.close() } catch (e: Throwable) { }
                  reader = null
                  val p = projection
                  projection = null
                  try { p?.stop() } catch (e: Throwable) { }
                  try { thread?.quitSafely() } catch (e: Throwable) { }
                  thread = null
                  bmp = null
                  stopping = false
              }

              override fun onDestroy() {
                  stopAll()
                  super.onDestroy()
              }
          }
