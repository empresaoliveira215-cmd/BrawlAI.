                      stopAll()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val code = intent?.getIntExtra("code", 0) ?: 0
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33) intent?.getParcelableExtra("data", Intent::class.java) else intent?.getParcelableExtra("data")
                  if (data == null) {
