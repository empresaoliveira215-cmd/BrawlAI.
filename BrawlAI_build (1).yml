                  try {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(NotificationChannel(CH, "Visao em tempo real", NotificationManager.IMPORTANCE_LOW))
                      val n = Notification.Builder(this, CH)
                          .setContentTitle("Brawl AI")
                          .setContentText("Visao em tempo real ativa")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .build()
                      startForeground(11, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                      startCapture(code, data)
                  } catch (e: Throwable) {
                      BotService.denied()
                      stopAll()
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              private fun startCapture(code: Int, data: Intent) {
                  stopAll()
                  val t = HandlerThread("brawlai-cap")
                  t.start()
                  thread = t
                  val hd = Handler(t.looper)
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val p = mpm.getMediaProjection(code, data)
                  projection = p
                  p.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopAll()
                          stopSelf()
